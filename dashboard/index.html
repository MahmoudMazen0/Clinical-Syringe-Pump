<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="Syringe Pump Pro — Medical-grade infusion pump control dashboard for ESP32-based syringe pump systems." />
    <title>Syringe Pump Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card" id="modal-card">
        <div class="modal-icon" id="modal-icon"></div>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-body" id="modal-body"></p>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <script src="app.js"></script>
  </body>
</html>
